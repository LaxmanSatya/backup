<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-class Selector</title>
    <style>
        button:hover{
            background-color:green;
        }
        #btn2:hover{
            background-color:lightgreen;
        }
    </style>
</head>
<body>
    <button onclick="alert('Thanks For Clicking Me!.....')">
        hello,ClickMe!
    </button>
    <button id = "btn2" onclick="alert('Thanks For Clicking Me!.....')">
        hello,ClickMe!
    </button>
</body>
</html>
